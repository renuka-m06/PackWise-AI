# ==============================================================================
# PackWise AI - Render Blueprint Deployment Configuration
# Infrastructure-as-Code for Automated Cloud Deployment (Backend + Frontend + DB)
# ==============================================================================

services:
  # 1. Production Backend Web Service
  - type: web
    name: packwise-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SERVICE_NAME
        value: foodpack-api
      - key: API_PREFIX
        value: /api/v1
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CORS_ORIGINS
        value: https://packwise-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: DATABASE_URL
        fromDatabase:
          name: packwise-postgres
          property: connectionString

  # 2. Production Frontend Static Site
  - type: web
    name: packwise-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        value: https://packwise-backend.onrender.com/api/v1

databases:
  # 3. Managed PostgreSQL Database
  - name: packwise-postgres
    region: oregon
    plan: free
    databaseName: packwise_db
    user: packwise_user
